name: core

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Must match the uniffi version pinned in Cargo.toml.
  UNIFFI_BINDGEN_CS_TAG: v0.11.1+v0.31.0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo-deny (advisories, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses

  swift:
    name: Swift bindings (XCFramework)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - run: scripts/build-xcframework.sh
      - name: Smoke-test the bindings
        working-directory: bindings/apple
        run: swift test
      - run: rm -rf bindings/apple/.build
      - uses: actions/upload-artifact@v4
        with:
          name: CtrlCore-swift
          path: bindings/apple

  csharp:
    name: C# bindings
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build -p ctrl-core --release
      - run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag $env:UNIFFI_BINDGEN_CS_TAG
      - run: uniffi-bindgen-cs --library target/release/ctrl_core.dll --out-dir bindings/cs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile the bindings
        run: dotnet build tools/csharp-bindings/CtrlCore.csproj -c Release
      - run: Copy-Item target/release/ctrl_core.dll bindings/cs/
      - uses: actions/upload-artifact@v4
        with:
          name: CtrlCore-csharp
          path: bindings/cs
