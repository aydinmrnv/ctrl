# cargo-deny configuration, checked in CI (`cargo deny check advisories licenses`).

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities fail the build wherever they are. "Unmaintained" notices
# only fail for crates we depend on directly; transitive ones (currently
# basic-toml via UniFFI's code generator and atomic-polyfill via postcard)
# are for those projects to replace.
unmaintained = "workspace"
# Add RUSTSEC IDs here, each with a reason, only when an advisory doesn't
# apply to how we use the crate.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    # UniFFI. File-level copyleft: it covers changes to UniFFI's own files, not our code.
    "MPL-2.0",
]

# Our own crates are unpublished and have no license chosen yet.
[licenses.private]
ignore = true
