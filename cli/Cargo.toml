[package]
name = "ctrl-cli"
description = "Example command-line shell for ctrl-core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ctrl-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
